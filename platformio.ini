[platformio]
src_dir = esp32_marauder
test_dir = test

; ---------------------------------------------------------------------------
; Elecrow CrowPanel 5.0" Advance (ESP32-S3-WROOM-1 N16R8: 16MB flash, 8MB PSRAM)
; Build/Upload this env from the PlatformIO toolbar (VSCode) to flash the board.
;   pio run  -e crowpanel_adv_5            # build
;   pio run  -e crowpanel_adv_5 -t upload  # flash
;   pio device monitor -b 115200           # serial
;
; Uses the pioarduino platform fork because Marauder's dual-band / NimBLE-2 code
; targets arduino-esp32 core 3.x (ESP-IDF 5.x) -- the mainline espressif32
; platform only ships core 2.x. The board is selected via -D here, so configs.h
; keeps its default (all board #defines commented out).
; ---------------------------------------------------------------------------
[env:crowpanel_adv_5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
; Custom N16R8 board (boards/): declares 16 MB flash + octal PSRAM natively. The
; generic esp32-s3-devkitc-1 defaults to 8 MB, and in the from-source build that
; 8 MB wins over board_build.flash_size, so the 16 MB partition table is refused.
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
; Compile the sketch, but NOT esp32_marauder/libraries/** — those are Arduino
; libraries (resolved via lib_extra_dirs), and sweeping them in as app source
; also drags in their examples/ and extras/, which don't compile.
build_src_filter = +<*> -<libraries/> -<_min_test.cpp>
upload_speed = 921600
monitor_speed = 115200
; Pin the CH9102 bridge -- PlatformIO's auto-detect otherwise grabs an unrelated
; Bluetooth serial device (e.g. /dev/cu.NothingEara). Change if the port differs.
upload_port = /dev/cu.wchusbserial210
monitor_port = /dev/cu.wchusbserial210
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; QIO flash + OPI (octal) PSRAM (R8)
; From-source Arduino build (triggered by this option). The RGB panel's bounce
; ISR copies from the PSRAM framebuffer; a SPIFFS/NVS flash write disables the
; cache and the PSRAM read then faults ("Cache disabled but cached memory region
; accessed") -> boot loop on the splash. FETCH_INSTRUCTIONS + RODATA put code and
; rodata in PSRAM (XIP) so execution + the refill survive the flash-cache-disable
; window. Exact set Marauder-GD runs stably on this board (80 MHz octal PSRAM).
; First build rebuilds the Arduino/IDF libs from source (~20-40 min, one time).
custom_sdkconfig =
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_SPEED_80M=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  ; From-source mode ignores board_build.flash_size; set it here or the build
  ; defaults to 8 MB and refuses the 16 MB board + partition table. Both the
  ; choice bool AND the string are needed -- the partition tool reads the string.
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  CONFIG_ESPTOOLPY_FLASHSIZE="16MB"
; From-source compiles every managed component Arduino's idf_component.yml
; pulls in. Marauder uses none of the RainMaker/Insights/telemetry/zigbee/
; speech/modbus/mp3 cluster, and esp_insights fails embedding a cert it has no
; source for (https_server.crt). Drop the cluster -- also cuts build time a lot
; (esp-sr ships large speech models). Keep mdns/littlefs/libsodium (WiFi/FS).
custom_component_remove =
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/network_provisioning
  espressif/esp-sr
  espressif/esp-modbus
  espressif/esp-zigbee-lib
  espressif/esp-zboss-lib
  espressif/esp_modem
  espressif/esp-dsp
  espressif/cbor
  espressif/qrcode
  chmorgan/esp-libhelix-mp3
build_flags =
  -DMARAUDER_CROWPANEL_ADV
  ; This panel speaks the V1.1 backlight-controller protocol (black screen with
  ; the V1.2/V1.3 one). Drop this flag for a V1.2/V1.3 board.
  -DCROWPANEL_ADV_V11
  ; ponytail: temporary bring-up diagnostic -- DEVELOPER keeps ESP_LOG on (the
  ; sketch otherwise silences it), so boot/panic/abort backtraces reach UART0.
  ; Remove once the display is confirmed working.
  -DDEVELOPER
  -DCORE_DEBUG_LEVEL=5
  -DBOARD_HAS_PSRAM
  ; This board's USB-C is a CH9102 UART bridge on UART0, not native USB, so route
  ; Serial to UART0 (CDC_ON_BOOT=0) — otherwise logs go to the unconnected USB.
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_INCLUDE_SIMPLE
  ; Allow multiple symbol definitions (first wins). Marauder deliberately
  ; redefines ieee80211_raw_frame_sanity_check to enable raw 802.11 injection,
  ; and has a few header-defined globals; the Arduino build relies on this too.
  -Wl,-zmuldefs
; C++-only flags: scope to Marauder's own sources. In the from-source build,
; global build_flags also hit ESP-IDF's C files (wpa_supplicant), where
; -fpermissive/-std=gnu++17 are "valid for C++ not C" and IDF's -Werror makes
; that fatal. build_src_flags applies only to src_dir, so IDF C compiles clean.
; -fpermissive matches the Arduino IDE build (uint8_t*/char* casts -> warnings).
build_src_flags =
  -std=gnu++17
  -fpermissive
; Marauder's own libs ship as git submodules; pull the rest from the registry.
; (run `git submodule update --init --recursive` first)
lib_extra_dirs = esp32_marauder/libraries
; CrowPanel renders via LovyanGFX, not TFT_eSPI. The bundled TFT_eSPI fork also
; doesn't build for the ESP32-S3 (VSPI naming), so exclude it from this env.
lib_ignore = TFT_eSPI
; APA102 is only pulled in under HAS_T_DONGLE_LED (not this board), so it is not
; listed here. AsyncTCP uses the maintained esp32async fork (arduino-esp32 3.x).
lib_deps =
  lovyan03/LovyanGFX@^1.2.0
  stevemarple/MicroNMEA@^2.0.6
  plerup/EspSoftwareSerial@^8.2.0
  esp32async/AsyncTCP@^3.3.0
  esp32async/ESPAsyncWebServer@^3.6.0
  marian-craciunescu/ESP32Ping@^1.7
  ; WiFiScan.cpp uses the NimBLE 2.x API; the bundled submodule is 1.4.1.
  ; libdeps win over lib_extra_dirs. Version matches upstream CI for core 3.x.
  h2zero/NimBLE-Arduino@2.3.8

; ---------------------------------------------------------------------------
; TEMPORARY bring-up probe: minimal bare sketch (_min_test.cpp only), same
; platform/board/PSRAM/flash as crowpanel_adv_5 but NO Marauder code or libs.
; Isolates whether an early boot hang is in the env/board config or Marauder.
; Delete this env and _min_test.cpp once the display is confirmed working.
; ---------------------------------------------------------------------------
[env:crowpanel_test]
; Matches Elecrow's official CrowPanel-Advance-5 S3 V1.2/V1.3 config: platform 55,
; custom N16R8 board JSON, and a from-source 120 MHz-PSRAM build (custom_sdkconfig
; below). The RGB panel streams its PSRAM framebuffer by DMA at the pixel clock --
; at the default 80 MHz PSRAM the DMA underruns and the panel is black.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
build_src_filter = -<*> +<_min_test.cpp>
upload_speed = 921600
monitor_speed = 115200
upload_port = /dev/cu.wchusbserial210
monitor_port = /dev/cu.wchusbserial210
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
; THE trigger for pioarduino's from-source Arduino build (builder/frameworks/arduino.py
; line 50: has_option "custom_sdkconfig"). A bare -D flag or a lone sdkconfig.defaults
; does NOT rebuild the precompiled libs -- only this option does. It bakes 120 MHz
; octal PSRAM into a matched bootloader+app, which the RGB panel needs or it's black.
; First build compiles the Arduino/IDF libs from source (~20-40 min, one time).
custom_sdkconfig =
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_IDF_EXPERIMENTAL_FEATURES=y
  CONFIG_SPIRAM_SPEED_120M=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=5
lib_deps =
  lovyan03/LovyanGFX@1.2.26


[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = true
extra_scripts =
  pre:tools/native_coverage.py
build_src_filter =
  -<*>
  +<MarauderMacAddress.cpp>
  +<PcapHeader.cpp>
  +<Switches.cpp>
  +<DisplayLine.cpp>
  +<BeaconFrame.cpp>
  +<WdgResponse.cpp>
  +<FoxHuntTarget.cpp>
  +<TargetListSort.cpp>
  +<TDongleStats.cpp>
  +<IPv4Range.cpp>
  +<FirmwareMetadata.cpp>
  +<MenuMarquee.cpp>
  +<GpsTrackerStats.cpp>
  +<BootSplash.cpp>
  +<MenuInputRepeat.cpp>
  +<TDongleBus.cpp>
  +<RemoteIdModel.cpp>
  +<RemoteIdDecoder.cpp>
  +<MemoryGuard.cpp>
  +<CsiMotionModel.cpp>
  +<CensorText.cpp>
  +<StationSelection.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  --coverage
  -Itest/support

; ---------------------------------------------------------------------------
; Experimental: esp_lcd bounce-buffer RGB bus (as Marauder-GD) instead of
; LovyanGFX Bus_RGB, to stop PSRAM-contention colour swaps. Needs SPIRAM XIP so
; flash access doesn't disable the cache under the bounce-buffer ISR.
; custom_sdkconfig rebuilds the framework from source (slow first build).
; ---------------------------------------------------------------------------
[env:crowpanel_adv_5_bb]
extends = env:crowpanel_adv_5
build_flags =
  ${env:crowpanel_adv_5.build_flags}
  -DCROWPANEL_ADV_ESP_LCD_BUS
custom_sdkconfig =
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
